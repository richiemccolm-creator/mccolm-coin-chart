<style>
/* Hard-coded colour fallbacks first — CSS variables may be missing on very old TVs */
html,body{background:#04113d}
:root{
  --navy:#0a2472;
  --navy-deep:#04113d;
  --red:#d62828;
  --red-dark:#8b0000;
  --blue:#1560bd;
  --blue-dark:#0b3d91;
  --green:#1a7a34;
  --purple:#5b2c8d;
  --gold:#ffc42e;
  --gold-deep:#e08e00;
  --cream:#fdf6e3;
  --ink:#141414;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Nunito',Helvetica,Arial,sans-serif;
  color:#141414;color:var(--ink);
  min-height:100vh;
  background:#0a2472;
  background:
    -webkit-radial-gradient(50% 0%, circle, #1a3fa0 0%, #0a2472 45%, #04113d 100%),
    radial-gradient(circle at 50% 0%, #1a3fa0 0%, #0a2472 45%, #04113d 100%);
  position:relative;
  overflow-x:hidden;
}
/* halftone dot texture */
body::before{
  content:'';position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;
  background-image:-webkit-radial-gradient(rgba(255,255,255,.09) 1.4px, transparent 1.5px);
  background-image:radial-gradient(rgba(255,255,255,.09) 1.4px, transparent 1.5px);
  background-size:11px 11px;
}
/* radiating comic rays behind everything (skipped on engines without conic-gradient) */
body::after{
  content:'';position:fixed;top:-20vh;left:50%;
  -webkit-transform:translateX(-50%);transform:translateX(-50%);
  width:200vw;height:120vh;pointer-events:none;z-index:0;opacity:.16;
  background:transparent;
}
@supports (background: repeating-conic-gradient(red, blue)) {
  body::after{
    background:repeating-conic-gradient(from 0deg at 50% 30%, #fff 0deg 5deg, transparent 5deg 14deg);
  }
}
.skyline{position:fixed;bottom:0;left:0;width:100%;height:200px;z-index:0;opacity:.55;pointer-events:none}

.wrap{
  position:relative;z-index:2;max-width:1080px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px));
}

/* ---------- COMIC TYPE ---------- */
.comic{font-family:'Luckiest Guy',Impact,Haettenschweiler,sans-serif;letter-spacing:1.5px;line-height:1.05;text-transform:uppercase}
.bang{font-family:'Bangers',Impact,Haettenschweiler,sans-serif;letter-spacing:2px;text-transform:uppercase}
.outline-2{-webkit-text-stroke:2px #000;paint-order:stroke fill}
.outline-3{-webkit-text-stroke:3px #000;paint-order:stroke fill}

/* ---------- HEADER ---------- */
header{position:relative;text-align:center;padding:18px 6px 10px;margin-bottom:14px}
.burst{
  position:absolute;top:-6px;right:0;bottom:0;left:0;margin:auto;z-index:-1;
  background:#d62828;background:var(--red);
  -webkit-clip-path:polygon(50% 0%,57% 9%,66% 3%,69% 13%,80% 9%,79% 20%,91% 19%,86% 29%,98% 32%,90% 40%,100% 47%,90% 54%,98% 63%,86% 67%,91% 77%,79% 77%,80% 88%,69% 84%,66% 95%,57% 89%,50% 100%,43% 89%,34% 95%,31% 84%,20% 88%,21% 77%,9% 77%,14% 67%,2% 63%,10% 54%,0% 47%,10% 40%,2% 32%,14% 29%,9% 19%,21% 20%,20% 9%,31% 13%,34% 3%,43% 9%);
  clip-path:polygon(50% 0%,57% 9%,66% 3%,69% 13%,80% 9%,79% 20%,91% 19%,86% 29%,98% 32%,90% 40%,100% 47%,90% 54%,98% 63%,86% 67%,91% 77%,79% 77%,80% 88%,69% 84%,66% 95%,57% 89%,50% 100%,43% 89%,34% 95%,31% 84%,20% 88%,21% 77%,9% 77%,14% 67%,2% 63%,10% 54%,0% 47%,10% 40%,2% 32%,14% 29%,9% 19%,21% 20%,20% 9%,31% 13%,34% 3%,43% 9%);
  opacity:.85;
}
.title-line1{font-size:1.5rem;font-size:6.4vw}
.title-line2{font-size:2.6rem;font-size:11vw;color:#ffc42e;color:var(--gold);text-shadow:0 6px 0 #b25c00,0 9px 14px rgba(0,0,0,.5)}
@media (min-width:480px){.title-line1{font-size:2.1rem}.title-line2{font-size:3.6rem}}
@media (min-width:900px){.title-line1{font-size:2.9rem}.title-line2{font-size:5.2rem}}
.n-sam{color:#ff8c00}.n-isaac{color:#5aa9ff}.n-ben{color:#ff3b3b}.n-amp{color:#fff}
.ribbon{
  display:inline-block;margin-top:8px;background:#04113d;background:var(--navy-deep);color:#fff;
  border:3px solid #ffc42e;border-color:var(--gold);padding:6px 26px;font-size:.85rem;
  -webkit-clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);
  clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);
}
.logo-slot-wrap{position:absolute;top:10px;right:6px;width:70px}
.brand-logo{
  display:block;width:78vw;max-width:340px;height:auto;margin:0 auto 6px;
  -webkit-filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
}

/* ---------- IMAGE PLACEHOLDER SLOTS ---------- */
.slot{
  position:relative;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  background:rgba(255,255,255,.14);
  border:2px dashed rgba(255,255,255,.65);
  border-radius:10px;overflow:hidden;-webkit-flex:none;flex:none;
  color:rgba(255,255,255,.85);text-align:center;
}
.slot.light{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.35);color:rgba(0,0,0,.55)}
.slot.has-img,.row .icon-slot{
  background:transparent;border:none;overflow:visible;
}
.slot img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.slot .slot-label{font-size:.5rem;font-weight:900;letter-spacing:.4px;line-height:1.15;padding:2px;text-transform:uppercase}
.slot .slot-ico{font-size:1rem;opacity:.7}
.slot .slot-ico.emoji{font-size:1.45rem;opacity:1;line-height:1}

/* ---------- HERO SELECT ---------- */
.hero-row{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-flex-wrap:wrap;flex-wrap:wrap;
  margin:0 -5px 16px;
}
.hero-row > .hero-card{
  -webkit-box-flex:1;-webkit-flex:1 1 30%;flex:1 1 30%;
  min-width:0;margin:0 5px 10px;width:auto;
}
.hero-card{
  position:relative;cursor:pointer;border:4px solid #000;border-radius:14px;
  padding:8px 8px 10px;text-align:center;
  -webkit-transition:-webkit-transform .18s,box-shadow .18s,-webkit-filter .18s;
  transition:transform .18s,box-shadow .18s,filter .18s;
  box-shadow:0 6px 0 #000;
  -webkit-filter:saturate(.55) brightness(.8);filter:saturate(.55) brightness(.8);
}
.hero-card.active{
  -webkit-transform:translateY(-4px) scale(1.03);transform:translateY(-4px) scale(1.03);
  box-shadow:0 10px 0 #000,0 0 24px rgba(255,196,46,.75);
  -webkit-filter:none;filter:none;
}
.hero-card .portrait{
  width:100%;height:0;padding-bottom:133%;border-radius:8px;margin-bottom:6px;
  overflow:hidden;
}
.hero-card .portrait > div,
.hero-card .portrait.has-img img,
.hero-card .portrait img{
  position:absolute;top:0;left:0;width:100%;height:100%;
}
.hero-card .portrait > div{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
}
.hero-card .hname{font-size:1.05rem;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6)}
.hero-card .hprofile-hint{
  font-size:.62rem;font-weight:800;color:#fff;opacity:.9;margin-top:2px;
  text-shadow:0 1px 0 rgba(0,0,0,.5);letter-spacing:.2px;
}
.hero-card .hbal{
  display:inline-block;background:#000;color:#ffc42e;color:var(--gold);
  border-radius:999px;padding:1px 10px;font-weight:900;font-size:.8rem;margin-top:2px;
}
.h-sam{background:-webkit-linear-gradient(290deg,#ffb347,#ff7a00 45%,#e85d04);background:linear-gradient(160deg,#ffb347,#ff7a00 45%,#e85d04)}
.h-isaac{background:-webkit-linear-gradient(290deg,#5aa9ff,#0b3d91);background:linear-gradient(160deg,#5aa9ff,#0b3d91)}
.h-ben{background:-webkit-linear-gradient(290deg,#ff5b5b,#d62828 50%,#8b0000);background:linear-gradient(160deg,#ff5b5b,#d62828 50%,#8b0000)}

/* ---------- STICKY KID PIN (while scrolled) ---------- */
.kid-pin{
  position:fixed;z-index:90;left:50%;
  top:calc(10px + env(safe-area-inset-top, 0px));
  -webkit-transform:translateX(-50%);transform:translateX(-50%);
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  max-width:calc(100% - 28px);padding:5px 14px 5px 5px;
  border:3px solid #000;border-radius:999px;cursor:pointer;
  box-shadow:0 5px 0 #000,0 10px 22px rgba(0,0,0,.35);
  -webkit-animation:kidPinIn .22s ease-out;animation:kidPinIn .22s ease-out;
  -webkit-tap-highlight-color:transparent;
  font:inherit;color:inherit;appearance:none;-webkit-appearance:none;margin:0;
}
.kid-pin > * + *{margin-left:10px}
.kid-pin:active{-webkit-transform:translateX(-50%) translateY(2px);transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #000}
.kid-pin-face{
  width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid #000;
  background:rgba(255,255,255,.2);
}
.kid-pin-face.has-img,.kid-pin-face.has-img img{border-radius:50%}
.kid-pin-name{font-size:1.15rem;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.55);white-space:nowrap}
.kid-pin-bal{
  display:inline-block;background:#000;color:#ffc42e;color:var(--gold);
  border-radius:999px;padding:3px 10px;font-weight:900;font-size:.85rem;white-space:nowrap;
}
@-webkit-keyframes kidPinIn{from{-webkit-transform:translate(-50%,-14px);opacity:0}to{-webkit-transform:translate(-50%,0);opacity:1}}
@keyframes kidPinIn{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- VAULT / PROUD COIN STACK ---------- */
.vault{
  cursor:pointer;border:5px solid #000;border-radius:16px;margin-bottom:16px;
  background:#ffb300;
  background:-webkit-linear-gradient(285deg,#ffd75e,#ffb300 55%,#e08e00);
  background:linear-gradient(165deg,#ffd75e,#ffb300 55%,#e08e00);
  box-shadow:0 8px 0 #000,inset 0 3px 0 rgba(255,255,255,.6);
  padding:12px 14px 10px;
  position:relative;overflow:hidden;
}
.vault::after{
  content:'';position:absolute;top:-60%;left:-30%;width:60%;height:220%;
  background:-webkit-linear-gradient(left,transparent,rgba(255,255,255,.55),transparent);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  -webkit-transform:rotate(18deg);transform:rotate(18deg);
  -webkit-animation:sweep 4.5s ease-in-out infinite;animation:sweep 4.5s ease-in-out infinite;
  pointer-events:none;
}
@-webkit-keyframes sweep{0%{left:-40%}55%{left:120%}100%{left:120%}}
@keyframes sweep{0%{left:-40%}55%{left:120%}100%{left:120%}}
.vault-main{
  position:relative;z-index:1;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:end;-webkit-align-items:flex-end;align-items:flex-end;
  -webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;
}
.vault-stack-col{
  -webkit-box-flex:1;-webkit-flex:1;flex:1;
  min-width:0;
  padding-right:10px;
}
.vault .lbl{font-weight:900;color:#7a3b00;font-size:.78rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.vault-stack-row{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:end;-webkit-align-items:flex-end;align-items:flex-end;
}
.vault-stack-row > * + *{margin-left:12px}
.coin-stack{
  position:relative;
  width:34px;
  -webkit-flex:none;flex:none;
  min-height:30px;
}
.stack-coin{
  position:absolute;left:1px;
  width:32px;height:32px;border-radius:50%;
  border:3px solid #8a5300;
  background:#ffc42e;
  background:-webkit-radial-gradient(35% 30%, circle, #fff3b0,#ffc42e 45%,#e08e00);
  background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc42e 45%,#e08e00);
  box-shadow:0 3px 0 #8a5300,inset 0 2px 2px rgba(255,255,255,.75);
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  -webkit-animation:stackPop .45s ease both;animation:stackPop .45s ease both;
}
.stack-coin.ghost{
  background:#c8c8c8;
  background:-webkit-radial-gradient(35% 30%, circle, #ececec,#c8c8c8 50%,#9a9a9a);
  background:radial-gradient(circle at 35% 30%,#ececec,#c8c8c8 50%,#9a9a9a);
  border:3px dashed #7a7a7a;
  box-shadow:none;
  opacity:.42;
  -webkit-animation:ghostPulse 2.2s ease-in-out infinite;animation:ghostPulse 2.2s ease-in-out infinite;
}
.stack-star{
  font-size:.72rem;line-height:1;color:#8a5300;font-weight:900;
  -webkit-transform:translateY(1px);transform:translateY(1px);
}
@-webkit-keyframes stackPop{
  0%{-webkit-transform:translateY(10px) scale(.72);opacity:0}
  65%{-webkit-transform:translateY(-3px) scale(1.08);opacity:1}
  100%{-webkit-transform:translateY(0) scale(1);opacity:1}
}
@keyframes stackPop{
  0%{transform:translateY(10px) scale(.72);opacity:0}
  65%{transform:translateY(-3px) scale(1.08);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}
}
@-webkit-keyframes ghostPulse{
  0%,100%{opacity:.32}
  50%{opacity:.55}
}
@keyframes ghostPulse{
  0%,100%{opacity:.32}
  50%{opacity:.55}
}
.vault-balance{min-width:0}
.vault .big{font-size:2.6rem;color:#8b0000;color:var(--red-dark);line-height:.9}
.vault-goal{
  margin-top:2px;font-weight:900;color:#7a3b00;font-size:.72rem;line-height:1.25;
  max-width:11.5rem;
}
.vault-powers{
  margin-top:8px;position:relative;z-index:2;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-flex-wrap:wrap;flex-wrap:wrap;
  gap:6px;
}
.vault-boosts{margin-top:0}
.vault-power-chips{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-flex-wrap:wrap;flex-wrap:wrap;gap:4px;
}
.vault-power-chip{
  display:-webkit-inline-box;display:-webkit-inline-flex;display:inline-flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  width:34px;height:34px;border-radius:10px;border:3px solid #000;
  background:#fff;font-size:1.15rem;line-height:1;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.vault-power-chip.used{opacity:.45;-webkit-filter:grayscale(.7);filter:grayscale(.7);background:#eee}
.vault-hero{
  -webkit-flex:none;flex:none;
  text-align:center;
  position:relative;z-index:1;
  padding-bottom:2px;
  background:transparent !important;
}
.vault-hero-face{
  width:104px;height:104px;border-radius:18px;border:4px solid #000;
  background:#fff;overflow:hidden;
  box-shadow:0 6px 0 rgba(0,0,0,.45);
  -webkit-animation:proudBob 2.4s ease-in-out infinite;animation:proudBob 2.4s ease-in-out infinite;
}
.vault-hero-face.has-img{border:4px solid #000;background:#fff;overflow:hidden}
.vault-hero-face img{
  width:100%;height:100%;object-fit:cover;object-position:center top;display:block;
  border-radius:14px;
}
.vault-hero.h-sam .vault-hero-face{box-shadow:0 6px 0 #c45f00,0 0 0 3px rgba(255,140,0,.35)}
.vault-hero.h-isaac .vault-hero-face{box-shadow:0 6px 0 #0b3d91,0 0 0 3px rgba(90,169,255,.35)}
.vault-hero.h-ben .vault-hero-face{box-shadow:0 6px 0 #8b0000,0 0 0 3px rgba(255,59,59,.35)}
.vault-hero-name{
  margin-top:6px;font-size:1.05rem;color:#111;line-height:1;
  text-shadow:2px 2px 0 #fff;
}
@-webkit-keyframes proudBob{
  0%,100%{-webkit-transform:translateY(0)}
  50%{-webkit-transform:translateY(-7px)}
}
@keyframes proudBob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
.vault .tap{
  position:relative;z-index:1;
  margin-top:8px;text-align:center;
  font-weight:900;color:#7a3b00;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.4px;
}
@media (max-width:380px){
  .vault-hero-face{width:86px;height:86px}
  .vault .big{font-size:2.2rem}
  .vault-goal{max-width:9.5rem;font-size:.68rem}
}

/* ---------- PANELS ---------- */
.cols{display:block}
.cols > .panel{margin-bottom:16px}
@media (min-width:900px){
  .cols{
    display:-webkit-box;display:-webkit-flex;display:flex;
    -webkit-box-align:start;-webkit-align-items:flex-start;align-items:flex-start;
  }
  .cols > .panel{-webkit-box-flex:1;-webkit-flex:1;flex:1;margin-bottom:0}
  .cols > .panel + .panel{margin-left:16px}
}
.panel{border:5px solid #000;border-radius:16px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.55)}
.panel.earn{background:#d62828;background:var(--red)}
.panel.shop{background:#1560bd;background:var(--blue)}
.panel.hero-timer-panel{
  background:#0a2472;background:var(--navy);
  margin-top:16px;
}
.panel.brush-wheel-panel{
  background:#5b2c8d;background:var(--purple);
  margin-top:16px;
}
.band.navy{background:#0a2472;background:var(--navy);color:#ffc42e}
.panel-head{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  padding:10px 12px 8px;
}
.panel-head > * + *{margin-left:10px}
.panel-head .ptitle{font-size:1.7rem;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55)}
.panel-body{background:#fdf6e3;background:var(--cream);margin:0 8px 8px;border:3px solid #000;border-radius:10px;padding:9px}

/* section banners */
.band{
  margin:4px 0 8px;text-align:center;color:#fff;padding:4px 10px;border:2px solid #000;
  font-size:.9rem;
  -webkit-clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);
  clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);
}
.band.gold{background:#ffc42e;background:var(--gold);color:#000}
.band.green{background:#1a7a34;background:var(--green)}
.band.purple{background:#5b2c8d;background:var(--purple)}
.band.red{background:#d62828;background:var(--red)}
.band.blue{background:#0b3d91;background:var(--blue-dark)}

/* rows — flex without gap (iOS < 14.5 / older Chromium) */
.row{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  background:#fff;border:2px solid #000;
  border-radius:9px;padding:7px 8px;margin-bottom:7px;box-shadow:0 3px 0 rgba(0,0,0,.25);
  -webkit-transition:background .15s,box-shadow .15s,border-color .15s,-webkit-transform .15s;
  transition:background .15s,box-shadow .15s,border-color .15s,transform .15s;
}
.row.is-pickable{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
.row.is-focused{
  background:#fff8d6;
  border-color:#ffc42e;border-color:var(--gold);
  border-width:3px;
  box-shadow:0 0 0 3px rgba(255,196,46,.45),0 5px 0 rgba(0,0,0,.28);

.hero-timer-adjust > * + *{margin-left:10px}
.hero-timer-adjust.in-modal{margin:8px 0 4px}
.hero-timer-display{
  font-size:2.4rem;color:#0a2472;line-height:1;min-width:4.2rem;text-align:center;
}
.hero-nudge{
  border:3px solid #000;border-radius:10px;background:#ffc42e;color:#141414;
  font-family:'Nunito',Helvetica,sans-serif;font-weight:900;font-size:.85rem;
  padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 #000;
}
.hero-nudge:active{-webkit-transform:translateY(2px);transform:translateY(2px);box-shadow:0 1px 0 #000}
.hero-nudge.fine{background:#fff;font-size:.75rem;padding:6px 10px;box-shadow:0 2px 0 #000}
.hero-timer-fine{
  margin-top:8px;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
}
.hero-timer-fine > * + *{margin-left:8px}
.hero-timer-start{margin-top:4px}
.hero-timer-sheet .sheet-body{background:#fff8e8}
.hero-timer-head{
  background:#0a2472;background:var(--navy);
  background:-webkit-linear-gradient(290deg,#1a3fa0,#0a2472 55%,#04113d);
  background:linear-gradient(160deg,#1a3fa0,#0a2472 55%,#04113d);
}
.hero-timer-num{color:#e08e00;color:var(--gold-deep)}
.hero-timer-tip{color:#0a2472}
.hero-timer-track{
  height:14px;border:3px solid #000;border-radius:999px;background:#111;
  overflow:hidden;margin:0 8px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15);
}
.hero-timer-fill{
  height:100%;width:0;
  background:#ffc42e;
  background:-webkit-linear-gradient(left,#ffd75e,#e08e00);
  background:linear-gradient(90deg,#ffd75e,#e08e00);
  -webkit-transition:width .25s linear;transition:width .25s linear;
}
.hero-timer-ring{margin-bottom:2px}
.hero-timer-sheet .celebrate .pop{color:#e08e00;color:var(--gold-deep)}

/* ---------- BRUSH-FIRST WHEEL ---------- */
.brush-wheel-blurb{
  text-align:center;font-weight:800;font-size:.88rem;color:#333;margin:0 0 10px;line-height:1.35;
}
.brush-wheel-mini{
  position:relative;width:88px;height:88px;margin:0 auto 12px;
}
.brush-wheel-mini-pointer{
  position:absolute;left:50%;top:-2px;z-index:2;
  -webkit-transform:translateX(-50%);transform:translateX(-50%);
  font-size:1rem;line-height:1;color:#111;
  text-shadow:0 1px 0 #fff;
}
.brush-wheel-disc{
  position:relative;width:220px;height:220px;margin:0 auto;
  border-radius:50%;border:6px solid #000;
  box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.35);
  background:#ff8c00;
  background:-webkit-conic-gradient(from 0deg, #ff8c00 0deg 120deg, #5aa9ff 120deg 240deg, #ff3b3b 240deg 360deg);
  background:conic-gradient(from 0deg, #ff8c00 0deg 120deg, #5aa9ff 120deg 240deg, #ff3b3b 240deg 360deg);
  -webkit-transition:none;transition:none;
}
.brush-wheel-disc-wrap{
  position:relative;width:220px;height:220px;margin:0 auto;
}
.brush-wheel-disc-wrap .brush-wheel-disc{
  width:100%;height:100%;margin:0;
}
.brush-wheel-disc.mini{
  width:88px;height:88px;border-width:4px;box-shadow:0 4px 0 rgba(0,0,0,.4);
  margin:0;
}
.brush-wheel-disc.is-spinning{
  -webkit-transition:-webkit-transform 4.4s cubic-bezier(0.12, 0.7, 0.08, 1);
  transition:transform 4.4s cubic-bezier(0.12, 0.7, 0.08, 1);
}
.brush-wheel-open{margin-top:2px}
.brush-wheel-sheet{max-width:420px}
.brush-wheel-head{
  background:#5b2c8d;background:var(--purple);
  background:-webkit-linear-gradient(290deg,#7d3dbd,#5b2c8d 55%,#3a1a5c);
  background:linear-gradient(160deg,#7d3dbd,#5b2c8d 55%,#3a1a5c);
}
.brush-wheel-stage{
  position:relative;padding:18px 8px 8px;margin-bottom:6px;
}
.brush-wheel-pointer{
  position:absolute;left:50%;top:2px;z-index:3;
  -webkit-transform:translateX(-50%);transform:translateX(-50%);
  font-size:1.6rem;line-height:1;color:#111;
  text-shadow:0 2px 0 #ffc42e, 0 0 0 #000;
  -webkit-animation:wheelPointerBob 1.1s ease-in-out infinite;
  animation:wheelPointerBob 1.1s ease-in-out infinite;
}
@-webkit-keyframes wheelPointerBob{
  0%,100%{-webkit-transform:translateX(-50%) translateY(0)}
  50%{-webkit-transform:translateX(-50%) translateY(4px)}
}
@keyframes wheelPointerBob{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(4px)}
}
.brush-wheel-slice-label{
  position:absolute;left:50%;top:50%;
  width:72px;margin-left:-36px;margin-top:-18px;
  text-align:center;pointer-events:none;
  -webkit-transform-origin:50% 50%;transform-origin:50% 50%;
}
.brush-wheel-slice-badge{
  display:block;font-size:1.25rem;line-height:1;
  text-shadow:0 2px 0 rgba(0,0,0,.35);
}
.brush-wheel-slice-name{
  display:block;font-family:'Luckiest Guy',Impact,sans-serif;
  font-size:.95rem;color:#fff;letter-spacing:.5px;
  text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
  line-height:1.1;margin-top:2px;
}
.brush-wheel-hub{
  position:absolute;left:50%;top:50%;
  width:52px;height:52px;margin:-26px 0 0 -26px;
  border-radius:50%;border:4px solid #000;background:#ffc42e;
  box-shadow:0 3px 0 #000,inset 0 2px 0 rgba(255,255,255,.6);
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  font-size:1.4rem;z-index:2;
  pointer-events:none;
}
.brush-wheel-result{padding-top:4px}
.brush-wheel-winner-face{
  width:96px;height:96px;border-radius:50%;border:4px solid #000;
  margin:0 auto 8px;overflow:hidden;background:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.4);
}
.brush-wheel-winner-face.has-img{border:4px solid #000;background:#fff;overflow:hidden}
.brush-wheel-winner-face img{
  width:100%;height:100%;object-fit:cover;object-position:center top;display:block;border-radius:50%;
}
.brush-wheel-sheet .btn{margin-top:8px}
.brush-wheel-sheet .btn:disabled{opacity:.55;cursor:not-allowed}

.celebrate{text-align:center;padding:10px 0}
.celebrate .pop{font-size:1.8rem;color:#1a7a34;color:var(--green);-webkit-animation:pop .5s ease-out;animation:pop .5s ease-out}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.4);opacity:0}60%{-webkit-transform:scale(1.18)}100%{-webkit-transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.spin{display:inline-block;-webkit-animation:spin 2.4s linear infinite;animation:spin 2.4s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

.hist-item{
  background:#fff;border:2px solid #000;border-left-width:8px;border-radius:8px;padding:8px 10px;margin-bottom:7px;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
}
.hist-item > * + *{margin-left:8px}
.hist-item.earned{border-left-color:#1a7a34;border-left-color:var(--green)}
.hist-item.spent{border-left-color:#d62828;border-left-color:var(--red)}
.hist-item .hdesc{font-weight:900;font-size:.88rem}
.hist-item .htime{font-size:.7rem;color:#666;font-weight:700}
.hist-item .hamt{margin-left:auto;font-family:'Luckiest Guy',Impact,sans-serif;font-size:1.2rem}
.hist-item.earned .hamt{color:#1a7a34;color:var(--green)}
.hist-item.spent .hamt{color:#d62828;color:var(--red)}

.toast{
  position:fixed;left:50%;bottom:20px;
  -webkit-transform:translateX(-50%);transform:translateX(-50%);
  z-index:200;
  background:#ffc42e;background:var(--gold);border:3px solid #000;border-radius:999px;padding:9px 20px;
  font-family:'Luckiest Guy',Impact,sans-serif;font-size:1rem;box-shadow:0 6px 0 rgba(0,0,0,.6);
  -webkit-animation:toastIn .3s ease-out;animation:toastIn .3s ease-out;
}
@-webkit-keyframes toastIn{from{-webkit-transform:translate(-50%,26px);opacity:0}to{-webkit-transform:translate(-50%,0);opacity:1}}
@keyframes toastIn{from{transform:translate(-50%,26px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- PROFILE / TROPHIES / UNLOCK ---------- */
.boost-pills{margin-top:4px;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:4px}
.boost-pill{
  display:inline-block;background:#111;color:#ffc42e;border:2px solid #000;border-radius:999px;
  padding:2px 8px;font-size:.68rem;font-weight:900;letter-spacing:.3px;
}
.row.free-pass{background:#e8fff0}
.row.free-pass.is-focused{background:#fff8d6}
.rsub.free-tag{color:#1a7a34;font-weight:900}

.profile-sheet{max-width:560px}
.profile-hero{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  margin-bottom:12px;
}
.profile-hero > * + *{margin-left:12px}
.profile-portrait{width:88px;height:88px;border-radius:50%;flex-shrink:0}
.profile-portrait.has-img img,.profile-portrait img{border-radius:50%}
.profile-name{font-size:1.7rem;line-height:1.1}
.profile-bal{font-weight:900;font-size:1.05rem;margin-top:4px}

.stats-strip{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;
  gap:6px;margin:10px 0 14px;
}
.stat{
  -webkit-box-flex:1;-webkit-flex:1;flex:1;text-align:center;
  background:#fff;border:3px solid #000;border-radius:12px;padding:8px 4px;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.stat-n{font-family:'Luckiest Guy',Impact,sans-serif;font-size:1.45rem;line-height:1;color:#0a2472}
.stat-l{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#555;margin-top:2px}

.trophy-grid{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;margin:8px 0 14px;
}
.trophy-tile{
  width:calc(33.333% - 6px);min-width:90px;-webkit-box-flex:1;-webkit-flex:1 1 90px;flex:1 1 90px;
  max-width:120px;text-align:center;background:#fff;border:3px solid #000;border-radius:12px;
  padding:10px 6px;box-shadow:0 3px 0 rgba(0,0,0,.3);
}
.trophy-tile.earned{background:-webkit-linear-gradient(180deg,#fff9e0,#ffe08a);background:linear-gradient(180deg,#fff9e0,#ffe08a)}
.trophy-tile.locked{background:#e8e4dc;opacity:.72}
.trophy-ico{font-size:1.8rem;line-height:1;margin-bottom:4px}
.trophy-name{font-weight:900;font-size:.72rem;line-height:1.15}

.power-list{margin:8px 0 12px}
.power-row{
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  background:#fff;border:3px solid #000;border-radius:12px;padding:8px 10px;margin-bottom:8px;
  box-shadow:0 3px 0 rgba(0,0,0,.3);
}
.power-row > * + *{margin-left:10px}
.power-row.used{opacity:.55;background:#eee}
.power-ico{font-size:1.7rem;flex-shrink:0}
.power-text{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0}
.power-name{font-weight:900;font-size:.95rem}
.power-blurb{font-size:.75rem;font-weight:700;color:#555;margin-top:2px}
.used-badge{
  font-family:'Luckiest Guy',Impact,sans-serif;font-size:.75rem;color:#666;
  border:2px solid #666;border-radius:8px;padding:4px 8px;flex-shrink:0;
}
.empty-note{text-align:center;font-weight:800;color:#777;padding:10px 4px;width:100%}

.unlock-modal{z-index:150}
.unlock-sheet{max-width:420px}
.unlock-body{text-align:center;padding:18px 14px 16px}
.unlock-burst{
  font-size:4.2rem;line-height:1;margin-bottom:8px;
  -webkit-animation:pop .55s ease-out;animation:pop .55s ease-out;
}
.unlock-title{font-size:2rem;color:#0a2472;margin-bottom:8px}
.unlock-sub{font-weight:800;font-size:.95rem;color:#444;margin-bottom:14px;line-height:1.35}

#boot-error{

  background:#fdf6e3;border:4px solid #000;border-radius:14px;color:#141414;
  font-family:Helvetica,Arial,sans-serif;font-weight:700;display:none;
}
